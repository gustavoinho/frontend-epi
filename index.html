<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controle EPI</title>
<style>
body { font-family: Arial; padding: 20px; }
.hidden { display:none; }
.menu button { margin-right:10px; }
.item { border:1px solid #ccc; padding:10px; margin:5px 0; }
</style>
</head>
<body>

<div id="login">
  <h2>Senha</h2>
  <input type="password" id="senha">
  <button onclick="login()">Entrar</button>
</div>

<div id="app" class="hidden">

  <h1>Controle</h1>

  <div class="menu">
    <button onclick="aba='epi'; carregar()">EPIs</button>
    <button onclick="aba='material'; carregar()">Material</button>
    <button onclick="aba='uniforme'; carregar()">Uniforme</button>
  </div>

  <br>

  <input placeholder="Pesquisar" id="busca" oninput="carregar()">

  <button onclick="mostrarForm()">+ Novo</button>

  <div id="lista"></div>

</div>

<div id="form" class="hidden">
  <h2>Novo Item</h2>

  Nome: <input id="nome"><br>
  Quantidade: <input type="number" id="quantidade"><br>

  Tipo:
  <select id="tipo" onchange="verCA()">
    <option value="epi">EPI</option>
    <option value="material">Material</option>
    <option value="uniforme">Uniforme</option>
  </select><br>

  <div id="campoCA">
    CA: <input id="ca"><br>
  </div>

  Obs: <textarea id="obs"></textarea><br>

  <button onclick="salvar()">Salvar</button>
</div>

<script>
const API = "https://SEU-BACKEND-RENDER.onrender.com";

let aba = "epi";

function login() {
  fetch(API + "/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ senha: senha.value })
  })
  .then(r => {
    if (!r.ok) throw "erro";
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    carregar();
  })
  .catch(()=>alert("Senha errada"));
}

function carregar() {
  fetch(API + "/items")
  .then(r=>r.json())
  .then(data=>{
    let busca = document.getElementById("busca").value.toLowerCase();

    let filtrado = data.filter(i =>
      i.nome.toLowerCase().includes(busca) ||
      (i.ca || "").includes(busca)
    );

    if (aba) {
      filtrado = filtrado.filter(i => i.tipo === aba);
    }

    filtrado.sort((a,b)=>a.nome.localeCompare(b.nome));

    lista.innerHTML = filtrado.map(i=>`
      <div class="item">
        <b>${i.nome}</b> (${i.quantidade})
        <br>
        <button onclick="add(${i.id})">+</button>
        <button onclick="sub(${i.id})">-</button>
        <button onclick="del(${i.id})">Excluir</button>
      </div>
    `).join("");
  });
}

function salvar() {
  fetch(API + "/items", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      nome: nome.value,
      quantidade: quantidade.value,
      tipo: tipo.value,
      ca: ca.value,
      observacoes: obs.value
    })
  }).then(()=> {
    form.classList.add("hidden");
    carregar();
  });
}

function add(id) {
  fetch(API + "/items/"+id+"/add", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({valor:1})
  }).then(carregar);
}

function sub(id) {
  fetch(API + "/items/"+id+"/sub", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({valor:1})
  }).then(carregar);
}

function del(id) {
  if (!confirm("Excluir?")) return;
  fetch(API + "/items/"+id, {method:"DELETE"}).then(carregar);
}

function mostrarForm() {
  form.classList.remove("hidden");
}

function verCA() {
  campoCA.style.display = tipo.value === "epi" ? "block" : "none";
}
</script>

</body>
</html>
